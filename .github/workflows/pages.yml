name: Pages deployment intentionally disabled
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stop:
    runs-on: ubuntu-24.04
    steps:
      - name: Explain required hosting decision
        run: |
          echo "This is a Next.js application with server-side API routes."
          echo "GitHub Pages static hosting cannot serve /api/contact or /api/coupons."
          echo "Use an explicitly approved Next.js runtime deployment after CI and security review."
          exit 1

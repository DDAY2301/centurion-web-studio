name: Generate Lumeli coupon exports
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/lumeli-live-launch-20261120
    paths:
      - 'public/coupons/*.svg'
      - 'scripts/render_coupons.py'
      - 'requirements-coupons.txt'
      - '.github/workflows/coupon-assets.yml'
permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout same branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SVG renderer
        run: python -m pip install --disable-pip-version-check -r requirements-coupons.txt
      - name: Generate actual PNG/PDF files and ZIP
        run: python scripts/render_coupons.py
      - name: Upload coupon package artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumeli-coupons
          path: |
            public/coupons/*.png
            public/coupons/*.pdf
            public/coupons/*.zip
          if-no-files-found: error
      - name: Save generated downloads on the same branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/coupons/*.png public/coupons/*.pdf public/coupons/*.zip
          if git diff --cached --quiet; then
            echo "Coupon downloads already match their SVG sources"
          else
            git commit -m "chore(coupons): publish PNG/PDF downloads [skip ci]"
            git push origin "HEAD:${BRANCH}"
          fi
